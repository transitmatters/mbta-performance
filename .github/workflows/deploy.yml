name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Serialize deploys: CloudFormation rejects a change set while the stack is
# UPDATE_IN_PROGRESS, which silently drops the later of two close merges.
# Every run from main shares one group however it was triggered, and the group
# covers the checks too, so runs reach the deploy job in the order they started
# and an older commit can't deploy over a newer one. Runs from other branches
# never deploy (see the deploy job's `if`), so each gets a group of its own and
# can't cancel a deploy from main that's waiting its turn.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-prod' || format('deploy-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same checks a PR runs. Main runs them only here, so nothing deploys
  # unless they pass.
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  layer:
    uses: ./.github/workflows/layer.yml
    secrets: inherit

  deploy:
    needs: [lint, test, layer]
    # workflow_dispatch can be run from any branch, but prod is only ever main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    env:
      AWS_PROFILE: transitmatters
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Python via mise
        uses: jdx/mise-action@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Generate AWS profile
        run: |
          mkdir ~/.aws
          cat >> ~/.aws/credentials << EOF
          [$AWS_PROFILE]
          aws_access_key_id = $AWS_ACCESS_KEY_ID
          aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
          EOF
      - name: Run deploy shell script
        run: |
          uv sync --group dev
          bash devops/deploy.sh
