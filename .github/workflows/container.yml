name: container

# Builds the image the bus speed segment CronJobs in transitmatters/basement-dweller run (see
# Containerfile). Pull requests only build and smoke-test it; main also pushes it to GHCR, where
# the jobs pull the `main` tag at the start of every run.
on:
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - mbta-performance/chalicelib/**
      - .github/workflows/container.yml
  push:
    branches:
      - main
    paths:
      - Containerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - mbta-performance/chalicelib/**
      - .github/workflows/container.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: mbta-performance:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the job entry points
        run: |
          docker run --rm mbta-performance:test tippecanoe --version
          docker run --rm mbta-performance:test sh -c 'command -v tile-join'
          for module in ingest trends reference_tiles; do
            docker run --rm mbta-performance:test python -m mbta-performance.chalicelib.lamp.bus.$module --help
          done

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuilds from the cache the step above just filled, so this only pushes.
      - name: Push to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/transitmatters/mbta-performance:main
            ghcr.io/transitmatters/mbta-performance:${{ github.sha }}
          cache-from: type=gha
